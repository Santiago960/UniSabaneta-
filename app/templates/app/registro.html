{% extends 'app/base.html' %}

{% block content %}

<div class="hero">

    <h2>
        Registro Universitario
    </h2>

    <p>
        Crea una cuenta en UniSabaneta
    </p>

</div>

<div class="card" style="max-width:700px;margin:auto;">

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">

            Registrarse

        </button>

    </form>

</div>

{% endblock %}
